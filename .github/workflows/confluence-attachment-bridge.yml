name: Confluence Attachment Bridge

on:
  push:
    paths:
      - 'confluence-requests/*.json'

permissions:
  contents: read

jobs:
  download-confluence-attachment:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE="$(git diff --name-only HEAD^ HEAD -- 'confluence-requests/*.json' | tail -n 1)"
          if [[ -z "$REQUEST_FILE" || ! -f "$REQUEST_FILE" ]]; then
            echo 'No Confluence request JSON found in triggering commit.' >&2
            exit 1
          fi

          CONTENT_ID="$(jq -r '.contentId // empty' "$REQUEST_FILE")"
          ATTACHMENT_ID="$(jq -r '.attachmentId // empty' "$REQUEST_FILE")"

          if [[ ! "$CONTENT_ID" =~ ^[0-9]+$ ]]; then
            echo 'contentId must be numeric.' >&2
            exit 1
          fi
          if [[ ! "$ATTACHMENT_ID" =~ ^att[0-9]+$ ]]; then
            echo 'attachmentId must look like att123.' >&2
            exit 1
          fi

          echo "content_id=$CONTENT_ID" >> "$GITHUB_OUTPUT"
          echo "attachment_id=$ATTACHMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Validate Atlassian secrets
        shell: bash
        env:
          ATLASSIAN_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          ATLASSIAN_EMAIL: ${{ secrets.JIRA_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in ATLASSIAN_BASE_URL ATLASSIAN_EMAIL ATLASSIAN_API_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Download Confluence attachment
        id: download
        shell: bash
        env:
          ATLASSIAN_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          ATLASSIAN_EMAIL: ${{ secrets.JIRA_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          CONTENT_ID: ${{ steps.request.outputs.content_id }}
          ATTACHMENT_ID: ${{ steps.request.outputs.attachment_id }}
        run: |
          set -euo pipefail
          mkdir -p out

          NUMERIC_ID="${ATTACHMENT_ID#att}"
          META_URL="${ATLASSIAN_BASE_URL%/}/wiki/api/v2/attachments/${NUMERIC_ID}"

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 1 \
            --user "$ATLASSIAN_EMAIL:$ATLASSIAN_API_TOKEN" \
            --header 'Accept: application/json' \
            "$META_URL" > out/attachment-metadata.json

          FILENAME="$(jq -r '.title // empty' out/attachment-metadata.json)"
          MIME_TYPE="$(jq -r '.mediaType // empty' out/attachment-metadata.json)"
          DOWNLOAD_LINK="$(jq -r '._links.download // .downloadLink // empty' out/attachment-metadata.json)"

          if [[ -z "$DOWNLOAD_LINK" ]]; then
            DOWNLOAD_LINK="/wiki/rest/api/content/${CONTENT_ID}/child/attachment/${ATTACHMENT_ID}/download"
          elif [[ "$DOWNLOAD_LINK" != /wiki/* ]]; then
            DOWNLOAD_LINK="/wiki${DOWNLOAD_LINK}"
          fi

          if [[ -z "$FILENAME" ]]; then
            FILENAME="confluence-${ATTACHMENT_ID}"
          fi
          SAFE_FILENAME="$(basename "$FILENAME")"

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 1 \
            --user "$ATLASSIAN_EMAIL:$ATLASSIAN_API_TOKEN" \
            "${ATLASSIAN_BASE_URL%/}${DOWNLOAD_LINK}" \
            --output "out/$SAFE_FILENAME"

          jq -n \
            --arg contentId "$CONTENT_ID" \
            --arg attachmentId "$ATTACHMENT_ID" \
            --arg filename "$SAFE_FILENAME" \
            --arg mimeType "$MIME_TYPE" \
            '{contentId:$contentId, attachmentId:$attachmentId, filename:$filename, mimeType:$mimeType}' \
            > out/manifest.json

      - name: Upload attachment artifact
        uses: actions/upload-artifact@v4
        with:
          name: confluence-attachment-${{ steps.request.outputs.attachment_id }}
          path: out/
          if-no-files-found: error
          retention-days: 1
